name: Clinical runtime

on:
  push:
    branches:
      - agent/clinical-runtime
  workflow_dispatch:

jobs:
  clinical-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Install MEDDxAgent
        run: |
          uv venv
          uv pip install -e ".[dev]"
          uv pip install torch==2.3.1 --index-url https://download.pytorch.org/whl/cpu

      - name: Run clinical adapter tests
        run: uv run pytest -q tests/test_clinical_runtime.py tests/test_clinical_api.py
