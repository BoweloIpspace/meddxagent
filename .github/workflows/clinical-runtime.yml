name: Clinical runtime

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  clinical-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Install MEDDxAgent
        run: |
          uv venv
          uv pip install -e ".[dev]"
          uv pip install torch==2.3.1 --index-url https://download.pytorch.org/whl/cpu

      - name: Run clinical adapter tests
        run: uv run pytest -q tests/test_clinical_runtime.py tests/test_clinical_api.py tests/test_clinical_persistence.py tests/test_clinical_observability.py

      - name: Validate Railway deployment config
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path

          config = tomllib.loads(Path("railway.toml").read_text(encoding="utf-8"))
          assert config["build"]["builder"] == "DOCKERFILE"
          assert config["deploy"]["healthcheckPath"] == "/api/v1/health"
          assert config["deploy"]["healthcheckTimeout"] == 300
          assert config["deploy"]["restartPolicyType"] == "ON_FAILURE"
          assert config["deploy"]["restartPolicyMaxRetries"] == 10
          PY

      - name: Build and inspect deployable wheel
        run: |
          uv build --wheel
          uv run python - <<'PY'
          import glob
          import zipfile

          wheels = glob.glob("dist/*.whl")
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
              assert "ddxdriver/clinical/api.py" in names
              assert "ddxdriver/clinical/observability.py" in names
              assert "ddxdriver/clinical/persistence.py" in names
              assert "ddxdriver/clinical/clinical.yml" in names
              assert "ddxdriver/ddxdrivers/open_choice.py" in names
              entry_points = [name for name in names if name.endswith(".dist-info/entry_points.txt")]
              assert len(entry_points) == 1
              content = archive.read(entry_points[0]).decode("utf-8")
              assert "meddx-clinical-api = ddxdriver.clinical.api:main" in content
          PY
