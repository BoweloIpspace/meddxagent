name: Clinical runtime

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  clinical-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Install MEDDxAgent
        run: |
          uv venv
          uv pip install -e ".[dev]"
          uv pip install torch==2.3.1 --index-url https://download.pytorch.org/whl/cpu

      - name: Lint backend correctness
        run: uvx ruff check --select E4,E7,E9,F ddxdriver/clinical

      - name: Check backend formatting
        run: uvx black --check ddxdriver/clinical/lifecycle.py

      - name: Run backend static type analysis
        run: |
          uvx mypy \
            --ignore-missing-imports \
            --follow-imports=skip \
            --check-untyped-defs \
            ddxdriver/clinical/auth.py \
            ddxdriver/clinical/security.py \
            ddxdriver/clinical/lifecycle.py

      - name: Audit backend dependencies
        run: uvx pip-audit --local --skip-editable

      - name: Run clinical adapter tests
        run: |
          uv run pytest -q \
            tests/test_clinical_runtime.py \
            tests/test_clinical_api.py \
            tests/test_clinical_persistence.py \
            tests/test_clinical_observability.py \
            tests/test_clinical_security.py \
            tests/test_clinical_security_contract.py \
            tests/test_clinical_deployment_contract.py \
            tests/test_clinical_rag.py \
            tests/test_clinical_auth.py \
            tests/test_clinical_platform.py \
            tests/test_clinical_monitoring.py \
            tests/test_clinical_e2e.py

      - name: Validate Railway deployment config
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path

          config = tomllib.loads(Path("railway.toml").read_text(encoding="utf-8"))
          assert config["build"]["builder"] == "DOCKERFILE"
          assert config["deploy"]["healthcheckPath"] == "/api/v1/ready"
          assert config["deploy"]["healthcheckTimeout"] == 300
          assert config["deploy"]["restartPolicyType"] == "ON_FAILURE"
          assert config["deploy"]["restartPolicyMaxRetries"] == 10
          PY

      - name: Build and inspect deployable wheel
        run: |
          uv build --wheel
          uv run python - <<'PY'
          import glob
          import zipfile

          wheels = glob.glob("dist/*.whl")
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
              assert "ddxdriver/clinical/api.py" in names
              assert "ddxdriver/clinical/auth.py" in names
              assert "ddxdriver/clinical/lifecycle.py" in names
              assert "ddxdriver/clinical/monitoring.py" in names
              assert "ddxdriver/clinical/observability.py" in names
              assert "ddxdriver/clinical/persistence.py" in names
              assert "ddxdriver/clinical/security.py" in names
              assert "ddxdriver/clinical/clinical.yml" in names
              assert "ddxdriver/rag_agents/searchrag_standard.py" in names
              assert "ddxdriver/rag_agents/_searchrag_utils.py" in names
              assert "ddxdriver/ddxdrivers/open_choice.py" in names
              entry_points = [name for name in names if name.endswith(".dist-info/entry_points.txt")]
              assert len(entry_points) == 1
              content = archive.read(entry_points[0]).decode("utf-8")
              assert "meddx-clinical-api = ddxdriver.clinical.api:main" in content
          PY

      - name: Build and smoke-test production container
        run: |
          set -euo pipefail
          docker build -t meddxagent-ci .
          container_id=$(docker run -d -p 18000:8000 -e OAI_KEY=ci-placeholder meddxagent-ci)
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18000/api/v1/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs "$container_id"
          exit 1
